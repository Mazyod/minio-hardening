name: Publish Docker Hub repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Make the project repository public and verify anonymous access
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          def request(path, method="GET", data=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request("https://hub.docker.com" + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          token = request("/v2/auth/token", "POST", {
              "identifier": "openimage", "secret": os.environ.pop("DOCKERHUB_TOKEN"),
          })["access_token"]
          repo_path = "/v2/namespaces/openimage/repositories/minio"
          repository = request(repo_path, token=token)
          if repository["is_private"]:
              # Only expose the initial release created by this project.
              tags = request(repo_path + "/tags?page_size=100", token=token)
              expected = "sha256:436d5a214a9508db893434f81f671d1224d89c98f1ecd587d4e6ad4b9da32d0b"
              if tags["count"] != 1 or tags["results"][0]["name"] != "v0.1.0" or tags["results"][0]["digest"] != expected:
                  raise RuntimeError("Refusing to expose a repository containing unrelated images")
          request("/v2/repositories/openimage/minio/", "PATCH", {
              "is_private": False,
              "description": "MinIO security backports. Source and AGPL license: github.com/Mazyod/minio-hardening",
          }, token=token)
          if request(repo_path)["is_private"] is not False:
              raise RuntimeError("Docker Hub repository is not publicly readable")
          print("Verified public access to openimage/minio")
          PY
